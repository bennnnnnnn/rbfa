[project]
name = "rbfa"
version = "0.3.0"
description = "Home Assistant integration for RBFA (Royal Belgian Football Association) team calendars"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest-homeassistant-custom-component",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "ASYNC", # blocking calls in async code
    "B",     # bugbear
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "SIM",   # simplify
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pyright]
# Home Assistant declares entity attributes as cached_property and its base
# classes conflict with each other (e.g. `available`), so overriding them as HA
# documents always trips this rule. HA core type-checks with mypy instead.
reportIncompatibleVariableOverride = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
